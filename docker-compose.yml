version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lms_ai_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: lms_ai_rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  api_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_ai_api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/postgres}
      RABBITMQ_URL: ${DOCKER_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      FASTAPI_PORT: ${FASTAPI_PORT:-8001}
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      HF_HOME: /models/hf
      TRANSFORMERS_CACHE: /models/hf
    ports:
      - '${FASTAPI_PORT:-8001}:${FASTAPI_PORT:-8001}'
    volumes:
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ['/app/scripts/run_api.sh']

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_ai_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/postgres}
      RABBITMQ_URL: ${DOCKER_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      HF_HOME: /models/hf
      TRANSFORMERS_CACHE: /models/hf
      BACKEND_WEBHOOK_URL: ${BACKEND_WEBHOOK_URL:-http://host.docker.internal:8080/api/ai/callback}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ['/app/scripts/run_worker.sh']

volumes:
  postgres_data:
  model_cache:
